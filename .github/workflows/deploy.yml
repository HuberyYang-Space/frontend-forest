# /www/wwwroot/frontend-forest/

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-frontend-forest
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/setup@v3.1.2
        with:
          runtime: node@26
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - run: |
          tar -czf dist.tar.gz -C dist/ .
          cp .github/scripts/frontend_forest_deploy.py frontend_forest_deploy.py

      - uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          port: 22
          source: dist.tar.gz,frontend_forest_deploy.py
          target: /www/.frontend-forest-deploy/incoming/${{ github.run_id }}-${{ github.run_attempt }}/

      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          port: 22
          script: |
            set -eu
            release='${{ github.run_id }}-${{ github.run_attempt }}'
            cd "/www/.frontend-forest-deploy/incoming/$release"
            python3 -B frontend_forest_deploy.py publish /www/wwwroot/frontend-forest "$release" dist.tar.gz
            rm -f -- dist.tar.gz || printf '%s\n' '发布已切换，归档清理失败' >&2
